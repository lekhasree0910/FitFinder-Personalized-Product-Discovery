<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FitFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="brand-icon">F</div>
            <span class="brand-name">FitFinder</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="login.html" class="nav-link">Login</a>
        </div>
    </nav>

    <main class="container">
        <div class="auth-box">
            <h2 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center;">
                Create Your Account
            </h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.75rem;">
                Unlock personalized discovery across thousands of products and reviews.
            </p>

            <form onsubmit="handleRegisterSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="e.g. Rahul Mehta" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="e.g. rahul@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Create a secure password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    Sign Up
                </button>
            </form>

            <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem;">
                Already registered? <a href="login.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        FitFinder &copy; 2026 — ChoiceAI & CompareWise Recommendation Engine
    </footer>

    <script src="script.js"></script>
</body>
</html>
